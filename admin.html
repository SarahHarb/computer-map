<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المتابعة: مقدمة في الحاسوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--nv:#14213D;--gd:#F2B705;--bg:#F4F6FA;--ln:#E3E8EF;--mu:#6B7280;--ok:#1E8449;--okb:#E3F6EA;--md:#B9770E;--mdb:#FEF3DC;--bd:#C0392B;--bdb:#FDE8E6;--op:#2F5D9B;--opb:#E6EEF9}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:#1F2937}
header{background:var(--nv);color:#fff;padding:10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header .lg{width:40px;height:40px;border-radius:12px;background:var(--gd);display:grid;place-items:center;font-size:20px}
header h1{margin:0;font-size:20px;flex:1}header h1 small{display:block;font-size:12px;font-weight:600;color:#cfd6e2}
.hb{font-family:inherit;color:var(--nv);background:var(--gd);border:none;border-radius:10px;padding:7px 14px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}
.hb.gh{background:transparent;color:#fff;border:1px solid #ffffff55}
main{padding:18px 22px 60px;max-width:1500px;margin:auto}
.ann{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}.ann input{flex:1;min-width:220px;font-family:inherit;font-size:15px;padding:9px 12px;border:2px solid var(--ln);border-radius:10px}.hb.gh2{background:#fff;border:2px solid var(--ln);color:var(--nv)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--ln);display:flex;gap:12px;align-items:center}
.kpi i{font-style:normal;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--opb);flex:none}
.kpi b{display:block;font-size:26px;font-weight:900;color:var(--nv);line-height:1.2}.kpi span{color:var(--mu);font-size:13px;font-weight:600}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.nav button{font-family:inherit;border:2px solid var(--ln);background:#fff;border-radius:12px;padding:8px 16px;font-size:15px;cursor:pointer;font-weight:800;color:var(--nv)}
.nav button.on{background:var(--nv);color:var(--gd);border-color:var(--nv)}
.nav input{font-family:inherit;font-size:15px;padding:8px 14px;border:2px solid var(--ln);border-radius:12px;min-width:240px;margin-inline-start:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mu);font-weight:700;margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.secbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.secbar b{color:var(--nv)}
.secbar button{font-family:inherit;font-weight:800;font-size:14px;border:2px solid var(--ln);background:#fff;color:var(--nv);border-radius:999px;padding:5px 14px;cursor:pointer}.secbar button em{font-style:normal;color:var(--mu);font-size:12px;margin-inline-start:4px}
.secbar button.on{background:var(--gd);border-color:var(--gd)}.secbar button.add{border-style:dashed;color:var(--mu)}
.sec{margin-bottom:12px}.sech{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}.sech h2{margin:0;font-size:18px;color:var(--nv);margin-inline-end:auto}.sech h2 em{font-style:normal;font-size:13px;color:var(--mu);font-weight:700}
.addbox{padding:12px 16px;background:#FFFBEA;border-bottom:1px solid var(--ln)}.addbox p{margin:0 0 6px}.addbox textarea{width:100%;font-family:inherit;font-size:14px;border:2px solid var(--ln);border-radius:10px;padding:8px;direction:rtl}
.st.g{background:#E3F6EA;color:#1E7B45}.rm{border:none;background:none;color:#c0392b;cursor:pointer;font-size:15px}
.grp{margin-bottom:12px}.gh{margin:0;padding:10px 16px;font-size:17px;color:var(--nv);background:#FFF8DD;border-bottom:1px solid var(--ln)}.gh em,.gr em{font-style:normal;color:var(--mu);font-size:12.5px;font-weight:700}
.mx tr.gr td{background:#FFF8DD;font-weight:900;color:var(--nv);text-align:start;padding:6px 10px;position:sticky;right:0}
.qs{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.qs b{color:var(--nv);font-size:15px}.qd{display:inline-flex;gap:3px}.qd i{width:11px;height:11px;border-radius:3px;background:#E5E7EB}.qd i.y{background:#3FAE6A}.qd i.x{background:#E05252}
.ghost{opacity:.42;filter:grayscale(1)}.ghost,.ghost *{cursor:default!important}
.card{background:#fff;border-radius:16px;border:1px solid var(--ln);overflow:hidden}
/* lessons view */
.unit{margin-bottom:14px}
.unit h2{margin:0;padding:10px 16px;font-size:17px;color:#fff;background:var(--c);display:flex;align-items:center;gap:10px}
.unit h2 em{font-style:normal;margin-inline-start:auto;font-size:13px;opacity:.9}
.lrow{display:grid;grid-template-columns:44px minmax(180px,1.4fr) 1.3fr 90px 110px 1.4fr 26px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln);cursor:pointer}
.lrow:hover{background:#FFFBEA}.lrow.open{background:#FFF7DB}
.lrow .no{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900}
.lrow .nm b{display:block;font-size:15px}.lrow .nm small{color:var(--mu)}
.lrow .chev{color:var(--mu);transition:transform .2s}.lrow.open .chev{transform:rotate(180deg)}
.lhead{display:grid;grid-template-columns:44px minmax(180px,1.4fr) 1.3fr 90px 110px 1.4fr 26px;gap:12px;padding:6px 16px;font-size:12px;color:var(--mu);font-weight:800;background:#FAFBFD}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mu)}
.prog .bar{flex:1;height:10px;border-radius:9px;background:#EEF2F6;overflow:hidden;display:flex}.prog .bar i{display:block;height:100%}
.pill{display:inline-block;min-width:52px;text-align:center;border-radius:99px;padding:2px 10px;font-weight:800;font-size:14px}
.p-g{background:var(--okb);color:var(--ok)}.p-m{background:var(--mdb);color:var(--md)}.p-b{background:var(--bdb);color:var(--bd)}.p-z{background:#F3F4F6;color:#9CA3AF}
.miss{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.miss b{color:var(--bd)}
.ldet{padding:4px 16px 16px 16px;background:#FFFDF5;border-top:1px dashed #EAD9A0;display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.ldet h4{margin:12px 0 8px;font-size:15px;color:var(--nv)}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.flt button{font-family:inherit;font-size:13px;font-weight:800;border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:3px 12px;cursor:pointer}.flt button.on{background:var(--nv);color:#fff;border-color:var(--nv)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
th{background:#F3F5F9;text-align:right;padding:8px 10px;font-weight:800;font-size:13px;color:#374151;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid #F0F2F5;vertical-align:middle}
tr.ck{cursor:pointer}tr.ck:hover td{background:#FFFBEA}
.st{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.st.n{background:#F3F4F6;color:#9CA3AF}.st.o{background:var(--opb);color:var(--op)}
.tb{display:inline-flex;gap:2px}.tb span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:#F3F4F6;filter:grayscale(1);opacity:.35}.tb span.y{background:var(--opb);filter:none;opacity:1}
.qbar{display:flex;align-items:center;gap:8px}.qbar .bar{flex:1;height:8px;border-radius:9px;background:var(--bdb);overflow:hidden}.qbar .bar i{display:block;height:100%;background:#2E8B57}
.muted{color:var(--mu);font-size:13px}.empty{padding:22px;text-align:center;color:var(--mu)}
/* matrix */
.mx{overflow:auto;max-height:72vh}
.mx table{border-collapse:separate;border-spacing:3px;background:none;width:auto}
.mx th{background:none;padding:2px;font-size:11px;text-align:center;position:sticky;top:0;background:var(--bg);z-index:2}
.mx th.u{color:#fff;background:var(--c);border-radius:6px;font-size:11px;padding:3px 6px;top:0}
.mx tr.l2 th{top:24px}
.mx td{padding:0;border:none}
.mx td.nm{position:sticky;right:0;background:var(--bg);font-weight:700;font-size:13px;white-space:nowrap;padding-left:10px;z-index:1;cursor:pointer}
.mx td.nm:hover{color:var(--op);text-decoration:underline}
.cell{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;cursor:pointer}
.c-n{background:#EEF1F5}.c-o{background:#BFD3EE;color:#1d3d6b}.c-g{background:#3FAE6A;color:#fff}.c-m{background:#F4C04E;color:#5b3d00}.c-b{background:#E06656;color:#fff}
.cell:hover{outline:2px solid var(--nv)}
.mx td.sum{font-size:12px;font-weight:800;color:var(--nv);padding:0 8px;white-space:nowrap}
/* students */
.srow{display:grid;grid-template-columns:minmax(200px,1.3fr) 1.6fr 90px 90px 150px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln);cursor:pointer}
.srow:hover{background:#FFFBEA}.srow b{font-size:15px}.srow small{display:block;color:var(--mu);direction:ltr;text-align:right}
.shead{display:grid;grid-template-columns:minmax(200px,1.3fr) 1.6fr 90px 90px 150px;gap:14px;padding:8px 16px;font-size:12px;color:var(--mu);font-weight:800;background:#FAFBFD}
.dots{display:flex;gap:2px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:3px}
/* drawer */
#dr{position:fixed;top:0;bottom:0;left:0;width:min(760px,96vw);background:#fff;box-shadow:8px 0 40px rgba(0,0,0,.25);z-index:30;transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column}
#dr.show{transform:none}
#dr .hd{padding:14px 18px;background:var(--nv);color:#fff;display:flex;gap:10px;align-items:center}
#dr .hd h2{margin:0;font-size:20px;flex:1}#dr .hd h2 small{display:block;font-size:12px;color:#cfd6e2;direction:ltr;text-align:right}
#dr .bd{overflow:auto;padding:14px 18px 30px}
#dr h3{margin:16px 0 8px;font-size:16px;color:var(--nv)}
.x{font-family:inherit;border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.minis div{background:var(--bg);border-radius:12px;padding:8px 10px}.minis b{display:block;font-size:20px;color:var(--nv)}.minis span{font-size:12px;color:var(--mu);font-weight:700}
.hl td{background:#FFF3C4!important}
#gate{max-width:420px;margin:14vh auto;background:#fff;border-radius:16px;padding:26px;text-align:center;border:1px solid var(--ln)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.lrow,.lhead{grid-template-columns:40px 1fr 1fr 80px}.lrow>:nth-child(n+5),.lhead>:nth-child(n+5){display:none}.ldet{grid-template-columns:1fr}.srow,.shead{grid-template-columns:1fr 1fr 70px}.srow>:nth-child(n+4),.shead>:nth-child(n+4){display:none}}
</style></head><body>
<header><div class="lg">📊</div><h1>لوحة المتابعة<small>مقدمة في الحاسوب · سارة حرب</small></h1>

</main>

<script>
const D = {"U": [["الحاسوب ومكوناته", "#16213E"], ["الذاكرة والتخزين", "#2F5D9B"], ["البرمجيات", "#5B4B8A"], ["أنظمة التشغيل", "#5B4B8A"], ["الأخلاقيات", "#2E8B57"], ["الشبكات والإنترنت", "#D35400"], ["الحوسبة السحابية", "#D35400"], ["أمن المعلومات", "#C0392B"], ["الذكاء الاصطناعي", "#9A7D0A"]], "L": [["ما هو الحاسوب؟", "ما هو الحاسوب؟", 0, ["ترتيب دورة عمل الحاسوب الصحيح:", "الحاسوب يتكون من:"]], ["نظام الحاسوب", "نظام الحاسوب", 0, ["الكيان البشري يتكون من:", "ما الفرق بين الحاسوب ونظام الحاسوب؟"]], ["تصنيف الكيان المادي", "معايير تصنيف الكيان المادي", 0, ["أي مما يلي من الأجهزة المحيطية؟", "معايير تقسيم الكيان المادي:"]], ["المعالج CPU", "وحدة المعالجة المركزية CPU — عقل الحاسوب", 0, ["الوحدة التي تنفذ عمليات AND و OR:", "وحدة التحكم CU:", "كلما زاد عدد الأنوية:"]], ["الإدخال والإخراج", "وحدات الإدخال والإخراج", 0, ["أي مما يلي من وحدات الإخراج؟", "وظيفة الماسح الضوئي:"]], ["اللوحة الأم", "اللوحة الأم وما يتصل بها", 0, ["المنفذ الذي توصل عليه الطابعة:", "لماذا سميت اللوحة الأم بهذا الاسم؟"]], ["الذاكرة", "الذاكرة Memory — خريطة مفاهيمية", 1, ["أي مما يلي من الذاكرة الرئيسية؟", "أصغر وحدة لقياس سعة الذاكرة:"]], ["RAM و ROM و Cache", "مقارنة: RAM و ROM و Cache", 1, ["الذاكرة التي تُمسح عند إطفاء الجهاز:", "أسرع ذاكرة:", "برنامج BIOS مخزّن في:"]], ["التخزين المساند", "وسائط التخزين المساندة", 1, ["وسيط التخزين الذي يعمل بالليزر:", "من سيئات التخزين السحابي:"]], ["وحدات القياس", "وحدات قياس سعة الذاكرة", 1, ["1 بايت يساوي:", "3 ميجابايت = ؟ كيلوبايت", "أكبر وحدة مما يلي:"]], ["البرمجيات وأنواعها", "البرمجيات وأنواعها", 2, ["BIOS مثال على:", "برنامج مكافحة الفيروسات من:"]], ["البرامج التطبيقية", "البرامج التطبيقية حسب طريقة الحصول عليها", 2, ["البرنامج المجاني لفترة محدودة:", "Scratch مثال على برنامج:"]], ["لغات البرمجة", "لغات البرمجة والمترجمات", 2, ["أي لغة من اللغات عالية المستوى؟", "الذي يترجم البرنامج كله مرة واحدة:", "المفسر مقارنة بالمترجم:"]], ["أنظمة التشغيل", "أنظمة التشغيل ومهامها", 3, ["أول برنامج يبدأ بالتنفيذ عند تشغيل الحاسوب:", "القدرة على تنفيذ أكثر م     return `<div class="card sec"><div class="sech"><h2>${esc(x.name)} <em>${tot} طالب · دخل الموقع ${joined}</em></h2>
    <button class="hb" data-add="${x.id}">➕ إضافة طلاب</button><button class="hb gh2" data-ren="${x.id}">✏️ تغيير الاسم</button><button class="hb gh2" data-del="${x.id}">🗑️ حذف الشعبة</button></div>
    ${addTo == x.id ? `<div class="addbox"><p><b>الصقي قائمة الطلاب:</b> كل سطر فيه اسم الطالب وإيميله الجامعي (من Classroom أو Excel). أو ارفعي ملف CSV.</p>
      <textarea id="addTxt" rows="7" placeholder="أحمد محمد, s12345@ppu.edu.ps&#10;سارة علي, s67890@ppu.edu.ps"></textarea>
      <div><button class="hb" id="addGo">حفظ الطلاب</button> <label class="hb gh2">📄 ملف CSV<input type="file" id="addFile" accept=".csv,.txt" hidden></label> <button class="hb gh2" id="addX">إلغاء</button> <span id="addSt" class="muted"></span></div></div>` : ""}
    <table><tr><th>#</th><th>الطالب</th><th>الإيميل</th><th>الحالة</th><th>دروس فتحها</th><th>نسبة الصواب</th><th>آخر نشاط</th><th></th></tr>
    ${rows.map((r, k) => { const { p, s } = stat(r.email); return `<tr class="${p ? "ck" : ""}" ${p ? `data-s="${p.id}"` : ""}><td class="muted">${k + 1}</td><td><b>${esc(r.name || (p && p.full_name) || "—")}</b></td><td class="muted" dir="ltr">${esc(r.email)}</td>
      <td>${p ? `<span class="st g">✓ دخل الموقع</span>` : `<span class="st n">لم يدخل بعد</span>`}</td><td>${s ? `${s.n}/${LS.length}` : "—"}</td><td>${s ? pill(s.p) : "—"}</td><td class="muted">${s ? ago(s.last) : "—"}</td>
      <td><button class="rm" data-rm="${esc(r.email)}" title="إزالة من الشعبة">✕</button></td></tr>`; }).join("") || `<tr><td colspan="8" class="empty">لا يوجد طلاب في هذه الشعبة بعد. اضغطي «إضافة طلاب».</td></tr>`}</table></div>`; }).join("")
    || `<div class="card empty">لا توجد شعب بعد. اضغطي «➕ شعبة جديدة».</div>`;
}
function parseRoster(txt) {
  const out = []; txt.split(/\r?\n/).forEach((line) => { const m = line.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/); if (!m) return;
    const name = line.replace(m[0], "").replace(/["']/g, "").split(/[,;\t]/).map((x) => x.trim()).filter((x) => x && !/^\d+(\.\d+)?%?$/.test(x)).slice(0, 2).join(" ").trim();
    out.push({ email: m[0].toLowerCase(), name }); });
  return out;
}
function bindSec(el) {
  el.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => { addTo = addTo == b.dataset.add ? null : b.dataset.add; draw(); setTimeout(() => { const t = document.getElementById("addTxt"); if (t) t.focus(); }, 30); }));
  el.querySelectorAll("[data-ren]").forEach((b) => (b.onclick = async () => { const x = SEC.find((s) => s.id == b.dataset.ren), nm = prompt("الاسم الجديد للشعبة", x.name); if (!nm || !nm.trim()) return; const { error } = await sb.from("sections").update({ name: nm.trim() }).eq("id", x.id); if (error) return alert(error.message); load(); }));
  el.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { const x = SEC.find((s) => s.id == b.dataset.del); if (!confirm(`حذف «${x.name}»؟ سيُحذف طلابها من القائمة ولن يستطيعوا دخول الموقع (تبقى إجاباتهم محفوظة).`)) return; const { error } = await sb.from("sections").delete().eq("id", x.id); if (error) return alert(error.message); load(); }));
  el.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async (e) => { e.stopPropagation(); if (!confirm("إزالة " + b.dataset.rm + " من الشعبة؟ لن يستطيع دخول الموقع.")) return; const { error } = await sb.from("roster").delete().eq("email", b.dataset.rm); if (error) return alert(error.message); load(); }));
  const go = document.getElementById("addGo"); if (!go) return;
  document.getElementById("addX").onclick = () => { addTo = null; draw(); };
  document.getElementById("addFile").onchange = async (e) => { const f = e.target.files[0]; if (f) document.getElementById("addTxt").value = await f.text(); };
  go.onclick = async () => { const L = parseRoster(document.getElementById("addTxt").value), st = document.getElementById("addSt");
    if (!L.length) return (st.textContent = "لم أجد أي إيميل في النص.");
    const other = L.filter((x) => R.some((r) => r.email === x.email && r.section_id != addTo)).length;
    const { error } = await sb.from("roster").upsert(L.map((x) => ({ ...x, section_id: +addTo })), { onConflict: "email" });
    if (error) return (st.textContent = "⚠️ " + error.message);
    alert(`تمت إضافة ${L.length} طالب.` + (other ? `\n(${other} منهم كانوا في شعبة أخرى وتم نقلهم.)` : "")); addTo = null; load(); };
}
function bind() {

  const el = document.getElementById("view");
  el.querySelectorAll(".lrow").forEach((r) => (r.onclick = () => { const i = +r.dataset.l; openL = openL === i ? -1 : i; lf = "all"; draw(); }));

function student(id, focus) {

  h += `<h3>📚 تقدّمه في كل درس</h3>${LEG}<table><tr><th>الدرس</th><th>فتح الدرس</th><th>الأسئلة</th><th>الطرق</th><th>آخر مرة</th></tr>${LS.map((l) => { const c = s.L[l.i];
    return `<tr class="${l.i === focus ? "hl" : ""}" id="sl${l.i}"><td><b style="color:${UN[l.u].c}">${l.i + 1}.</b> ${esc(l.f)}</td><td>${openTag(c)}</td><td>${qTag(c, l)}</td><td><span class="tb">${TABS.map(([k, i, t]) => `<span class="${c && c.tabs.has(k) ? "y" : ""}" title="${t}">${i}</span>`).join("")}</span></td><td class="muted">${c ? ago(c.last) : "—"}</td></tr>`; }).join("")}</table>`;
  h += `<h3>❌ آخر الإجابات الخاطئة (${wrong.length})</h3>${wrong.length ? `<table><tr><th>الدرس</th><th>السؤال</th><th>إجابته</th><th>الصحيحة</th></tr>${wrong.map((a) => { const i = lessonOf(a.concept); return `<tr><td>${i >= 0 ? i + 1 : "—"}</td><td>${esc(a.question)}</td><td style="color:var(--bd);font-weight:700">${esc(a.answer)}</td><td style="color:var(--ok);font-weight:700">${esc(a.correct_answer)}</td></tr>`; }).join("")}</table>` : `<p class="muted">لا توجد إجابات خاطئة 👏</p>`}`;
  document.getElementById("dbody").innerHTML = h; document.getElementById("dr").classList.add("show");
  if (focus >= 0) setTimeout(() => { const r = document.getElementById("sl" + focus); if (r) r.scrollIntoView({ block: "center" }); }, 280); else document.getElementById("dbody").scrollTop = 0;
}
