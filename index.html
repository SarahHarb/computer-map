<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخارطة المفاهيمية التفاعلية — مقدمة في الحاسوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2937;--muted:#6B7280;--gold:#F1C40F;--func:#FFF3C4;--funcb:#C9A227;--bg:#F7F8FB}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #E5E7EB;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.top h1{font-size:18px;margin:0;flex:1;font-weight:800;color:#16213E}
.by{font-size:12px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:6px;padding:4px 14px 6px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border:1px solid #D1D5DB;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
button:hover{background:#F3F4F6}
button.on{background:#16213E;color:#fff;border-color:#16213E}
.lessons{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:thin}
.lessons button{white-space:nowrap;flex:none}
.lessons button.cur{background:var(--gold);border-color:#B7950B;font-weight:700}
.nav{display:flex;gap:6px;align-items:center;padding:0 14px 8px;font-size:13px;color:var(--muted)}
main{padding:16px 10px 80px;max-width:1100px;margin:auto}
.note{border:2px dashed #C0392B;background:#FDEDEC;border-radius:12px;padding:8px 14px;margin:0 0 16px;font-weight:700;font-size:14px}
.note b{color:#C0392B}
ul.tree{list-style:none;margin:0;padding:0}
ul.kids{list-style:none;margin:0 14px 0 0;padding:4px 18px 4px 0;border-right:2px solid var(--c,#9AA5B1);position:relative}
li.n{margin:6px 0;position:relative}
ul.kids>li.n::before{content:"";position:absolute;right:-18px;top:18px;width:16px;border-top:2px solid var(--c,#9AA5B1)}
.rel{display:inline-block;font-size:12px;font-style:italic;font-weight:700;color:var(--c);margin:2px 0 0;padding:0 4px}
.card{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--c);background:#fff;border-radius:6px;padding:4px 10px;font-weight:700;min-height:34px;cursor:default;transition:all .25s}
.card.lvl1{background:var(--c);color:#fff;font-size:18px;padding:8px 16px}
.card.lvl2{background:var(--c);color:#fff}
.card.lvl3{background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.card.f{background:var(--func);border:1px solid var(--funcb);border-radius:999px;font-weight:600;color:#333}
.card.leaf{font-weight:600;border-width:1.5px}
.card.has{cursor:pointer}
.chev{font-size:12px;transition:transform .2s;display:inline-block}
li.closed>.row .chev{transform:rotate(90deg)}
li.closed>ul.kids{display:none}
.def{display:block;font-size:13px;font-style:italic;color:#374151;background:#F3F3F3;border:1.5px dotted #777;border-radius:6px;padding:3px 8px;margin:4px 0 0;max-width:520px}
.def b{font-style:italic}
body.nodef .def{display:none}
.edge{display:block;font-size:12px;font-style:italic;font-weight:700;color:#555;margin-bottom:2px}
body.focus li.n{opacity:.28}
body.focus li.n.ctx,body.focus li.n.lit{opacity:1}
body.focus li.n.ctx>.row .card{filter:saturate(.6)}
.lit>.row .card{box-shadow:0 0 0 4px var(--gold),0 0 18px rgba(241,196,15,.8)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:22px;height:14px;border-radius:3px;border:2px solid #2F5D9B}
.sw.f{background:var(--func);border:1px solid var(--funcb);border-radius:999px}
.sw.d{background:#F3F3F3;border:1.5px dotted #777}
@media (max-width:600px){body{font-size:15px}.top h1{font-size:15px}ul.kids{margin-right:8px;padding-right:12px}ul.kids>li.n::before{right:-12px;width:10px}}
</style></head>
